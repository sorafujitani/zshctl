[workspace]
resolver = "2"
members = [
  "crates/zshctl-cli",
  "crates/zshctl-config",
  "crates/zshctl-core",
  "crates/zshctl-daemon",
  "crates/zshctl-history",
  "crates/zshctl-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/sorafujitani/zshctl"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
fancy-regex = "0.14"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.11"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shell-words = "1.1"
tempfile = "3.13"
thiserror = "2.0"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
