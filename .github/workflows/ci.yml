name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt
      - name: Install feature-test tools
        run: |
          if command -v brew >/dev/null 2>&1; then
            brew install fzf ghq
          else
            sudo apt-get update
            sudo apt-get install -y fzf zsh
            go install github.com/x-motemen/ghq@v1.9.4
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: ZSHCTL_BIN="$PWD/target/release/zshctl" zsh tests/zsh/smoke.zsh
      - run: ZSHCTL_BIN="$PWD/target/release/zshctl" tests/daemon/lifecycle.sh
      - run: ZSHCTL_BIN="$PWD/target/release/zshctl" tests/history/stress.sh
      - run: ZSHCTL_BIN="$PWD/target/release/zshctl" tests/config/cache.sh
      - run: ZSHCTL_BIN="$PWD/target/release/zshctl" tests/zsh/fallback.sh
      - run: ZSHCTL_BIN="$PWD/target/release/zshctl" tests/features/completion.sh
      - run: ZSHCTL_BIN="$PWD/target/release/zshctl" tests/release/matrix.sh
